<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide-container { width: 1280px; min-height: 720px; background: #172A3A; display: flex; flex-direction: column; position: relative; font-family: 'Inter', sans-serif; overflow: hidden; }
    h1 { font-family: 'Playfair Display', serif; color: #F9F8F4; line-height: 1.1; }
    .accent { color: #D49A31; }
    .motif { position: absolute; bottom: 48px; left: 0; width: 100%; height: 6px; }
    .line-gold { height: 2px; background: #D49A31; width: 100%; }
    .line-petrol { height: 4px; background: #172A3A; width: 100%; }
    .footer { position: absolute; bottom: 20px; left: 48px; right: 48px; display: flex; justify-content: space-between; color: #F9F8F4; font-size: 14px; opacity: 0.8; }
    .logo-box { position: absolute; top: 48px; left: 48px; display: flex; align-items: center; gap: 12px; }
    .logo-mark { width: 40px; height: 40px; border: 2px solid #D49A31; display: flex; align-items: center; justify-content: center; font-family: 'Playfair Display', serif; font-weight: 700; font-size: 24px; color: #D49A31; }
  </style>
</head>
<body>
  <div class="slide-container">
    <div class="logo-box">
      <div class="logo-mark">I</div>
      <span class="text-[#F9F8F4] font-semibold tracking-widest text-sm uppercase">InsurMinds</span>
    </div>
    
    <div class="flex-1 flex flex-col justify-center px-[48px]">
      <div class="text-[#D49A31] uppercase tracking-[0.2em] font-semibold text-xl mb-6">Mesa de Subscrição · MVP</div>
      <h1 class="text-[86px] max-w-[900px] mb-8">Análise Inteligente de <span class="accent italic">Apólices D&O</span></h1>
      <p class="text-[#F9F8F4] text-[24px] max-w-[700px] leading-relaxed opacity-90 border-l-4 border-[#D49A31] pl-8">
        Plataforma automatizada para extração, estruturação e comparação de riscos executivos orientada por evidências.
      </p>
    </div>

    <div class="motif">
      <div class="line-gold"></div>
    </div>
    
    <div class="footer">
      <span>Projeto Final · 2026</span>
      <span class="font-semibold uppercase tracking-widest">Autoria: Curié Edge</span>
    </div>
  </div>
</body>
</html>
