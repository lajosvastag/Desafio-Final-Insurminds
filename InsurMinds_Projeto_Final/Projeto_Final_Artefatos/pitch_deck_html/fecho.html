<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide-container { width: 1280px; min-height: 720px; background: #172A3A; display: flex; flex-direction: column; position: relative; font-family: 'Inter', sans-serif; overflow: hidden; }
    h1 { font-family: 'Playfair Display', serif; color: #F9F8F4; line-height: 1.1; }
    .accent { color: #D49A31; }
    .motif { position: absolute; bottom: 48px; left: 0; width: 100%; height: 6px; }
    .line-gold { height: 2px; background: #D49A31; width: 100%; }
    .footer { position: absolute; bottom: 20px; left: 48px; right: 48px; display: flex; justify-content: space-between; color: #F9F8F4; font-size: 14px; opacity: 0.8; }
  </style>
</head>
<body>
  <div class="slide-container">
    <div class="flex-1 flex flex-col justify-center items-center text-center px-[48px]">
      <div class="text-[#D49A31] uppercase tracking-[0.2em] font-semibold text-xl mb-6">InsurMinds</div>
      <h1 class="text-[72px] max-w-[900px] mb-8">Compare proteção. <br>Encontre as <span class="accent italic">lacunas.</span></h1>
      
      <div class="h-px w-64 bg-[#D49A31] mb-12"></div>
      
      <div class="text-[#F9F8F4] text-[20px] opacity-80 space-y-2">
        <p class="font-bold">CURIE EDGE</p>
        <p>Projeto Final · Módulo Avançado · 2026</p>
        <p class="text-sm tracking-widest uppercase mt-6 opacity-60">tecnologia a serviço da subscrição</p>
      </div>
    </div>

    <div class="motif">
      <div class="line-gold"></div>
    </div>
    
    <div class="footer">
      <span>InsurMinds MVP</span>
      <span class="font-semibold uppercase tracking-widest">Autoria: Curié Edge</span>
    </div>
  </div>
</body>
</html>
